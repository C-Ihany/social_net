{% load i18n %}
<script type="text/javascript">
	/* Refuse une demande d'ami (POST + jeton CSRF : la vue refuse le GET).
	   Le rappel d'interface n'est appelé qu'en cas de SUCCÈS : avant, il partait
	   dans `complete`, et la page se mettait à jour même quand le serveur refusait. */
	function declineFriendRequest(friend_request_id, uiUpdateFunction){
		$.ajax({
			type: 'POST',
			dataType: "json",
			url: "{% url 'friend:friend-request-decline' friend_request_id=53252623623632623 %}".replace("53252623623632623", friend_request_id),
			data: { csrfmiddlewaretoken: "{{ csrf_token }}" },
			timeout: 8000,
			success: function(data) {
				if(data['response'] == "Friend request declined."){
					vzToast('{% trans "Demande refusée"|escapejs %}', 'success')
					if (typeof uiUpdateFunction === 'function') uiUpdateFunction()
				}
				else if(data['response'] != null){
					vzAlert(data['response'])
				}
			},
			error: function(xhr) {
				var msg = "{% trans 'Une erreur est survenue'|escapejs %}"
				if (xhr && xhr.responseJSON && xhr.responseJSON.response) msg = xhr.responseJSON.response
				vzAlert(msg)
			}
		});
	}
</script>
