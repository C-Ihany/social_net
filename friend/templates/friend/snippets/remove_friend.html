{% load i18n %}
<script type="text/javascript">
	/* Retire le membre `id` de ses amis.
	   Le rappel d'interface n'est appelé qu'en cas de SUCCÈS : avant, il partait
	   dans `complete`, et la page se mettait à jour même quand le serveur refusait. */
	function removeFriend(id, uiUpdateFunction){
		$.ajax({
			type: 'POST',
			dataType: "json",
			url: "{% url 'friend:remove-friend' %}",
			data: { csrfmiddlewaretoken: "{{ csrf_token }}", receiver_user_id: id },
			timeout: 8000,
			success: function(data) {
				if(data['response'] == "Successfully removed that friend."){
					vzToast('{% trans "Ami retiré"|escapejs %}', 'success')
					if (typeof uiUpdateFunction === 'function') uiUpdateFunction()
				}
				else if(data['response'] != null){
					vzAlert(data['response'])
				}
			},
			error: function(xhr) {
				var msg = "{% trans 'Une erreur est survenue'|escapejs %}"
				if (xhr && xhr.responseJSON && xhr.responseJSON.response) msg = xhr.responseJSON.response
				vzAlert(msg)
			}
		});
	}
</script>
